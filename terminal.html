<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Terminal NFL LABS</title>
<style>
/* Page relais : le hub privé ne peut pas ouvrir nfllabs:// lui-même, alors il passe par ici. */
:root { color-scheme: dark; --night: #08111f; --panel: #0f1b2e; --line: #24354f; --ink: #eef2f7; --muted: #8d9bb1; --lights: #ffb81c; --lights-ink: #1c1300; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--night); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font: 800 1.6rem "Arial Narrow", Impact, sans-serif; text-transform: uppercase; letter-spacing: .03em; }
p { margin: 0; color: var(--muted); }
a.btn { align-self: flex-start; background: var(--lights); color: var(--lights-ink); text-decoration: none; font-weight: 700; border-radius: 8px; padding: 10px 18px; }
</style>
</head>
<body>
<div class="box">
  <h1 id="t">Ouverture du terminal…</h1>
  <p id="p">Si rien ne s'ouvre, clique sur le bouton. Tu peux fermer cet onglet après.</p>
  <a class="btn" id="go" href="#">Ouvrir le terminal</a>
</div>
<script>
const id = new URLSearchParams(location.search).get("m") || "";
if (/^[a-z0-9-]{1,40}$/.test(id)) {
  const lien = "nfllabs://" + id;
  document.getElementById("go").href = lien;
  location.href = lien;
} else {
  document.getElementById("t").textContent = "Module inconnu";
  document.getElementById("p").textContent = "Retourne au hub et clique sur le bouton Terminal d'un module.";
  document.getElementById("go").hidden = true;
}
</script>
</body>
</html>
