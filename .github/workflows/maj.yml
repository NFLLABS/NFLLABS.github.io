name: Mise à jour des données

on:
  schedule:
    # Heures UTC. Pendant les matchs : aux 10 minutes (décalé de 3 min, GitHub est moins chargé hors de l'heure pile)
    - cron: "3-59/10 16-23 * * 0"     # dimanche après-midi et soir
    - cron: "3-59/10 22-23 * * 1,4"   # lundi et jeudi, début de soirée
    - cron: "3-59/10 0-5 * * 1,2,5"   # fin des matchs du dimanche, lundi et jeudi soir
    # Le reste des jours de match : aux 30 minutes
    - cron: "3-59/30 0-15 * * 0"
    - cron: "3-59/30 6-21 * * 1,4"
    # Les autres jours : 2 fois (7 h et 18 h, heure de l'Est)
    - cron: "3 11,22 * * 2,3,5,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Données (scores, cotes, stats, propositions, fantasy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -I -X utf8 scripts/run_all.py
      - name: Publier
        run: |
          git config user.name "NFL LABS robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then echo "Rien de neuf"; exit 0; fi
          git commit -q -m "Données $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase --autostash && git push -q
